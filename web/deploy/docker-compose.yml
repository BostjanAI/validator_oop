# On-prem deployment (interno omrežje, brez dostopa z interneta).
#
# Zagon:   docker compose -f web/deploy/docker-compose.yml up -d --build
# Dostop:  http://<streznik>:8080
#
# Za HTTPS z internim certifikatom (AD CS) odkomentiraj nginx 443 sekcijo
# in priloži certifikat ter ključ v ./certs.

services:
  validator:
    build:
      context: ../..
      dockerfile: web/deploy/Dockerfile
    image: mes-validator-web:latest
    environment:
      MES_WEB_WORKDIR: /data
      MES_WEB_MAX_WORKERS: "2"
      MES_WEB_MAX_UPLOAD_MB: "50"
      MES_WEB_JOB_TTL_MIN: "120"
    volumes:
      - validator_data:/data
      # Opcijsko: šifranti / SOP iz network share, samo za branje
      # - /mnt/share/sifranti:/sifranti:ro
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - validator
    ports:
      - "8080:80"
      # - "8443:443"   # HTTPS (glej nginx.conf in ./certs)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  validator_data:
