# nginx reverse proxy za MES Excel Validator (interno omrežje).
#
# HTTP (privzeto) + pripravljen HTTPS blok za interni certifikat (AD CS).
# Za vklop HTTPS glej web/deploy/HTTPS_AD_CS.md.

upstream mes_validator {
    server validator:8000;
}

# Podpora za WebSocket upgrade (real-time napredek validacije)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Dovoli nalaganje večjih Excel datotek (uskladi z MES_WEB_MAX_UPLOAD_MB).
    client_max_body_size 60m;

    # Ob vklopu HTTPS preusmeri ves promet na 443 (odkomentiraj):
    # return 301 https://$host$request_uri;

    location /api/ws/ {
        proxy_pass http://mes_validator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://mes_validator;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

