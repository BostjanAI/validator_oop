# nginx reverse proxy za MES Excel Validator (interno omrežje).

upstream mes_validator {
    server validator:8000;
}

server {
    listen 80;
    server_name _;

    # Dovoli nalaganje večjih Excel datotek (uskladi z MES_WEB_MAX_UPLOAD_MB).
    client_max_body_size 60m;

    location / {
        proxy_pass http://mes_validator;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

